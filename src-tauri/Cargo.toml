[package]
name = "uurelaybridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "UURelayBridge - Clash Verge Rev extension config generator + local TLS relay"
authors = ["UURelayBridge"]
default-run = "uurelaybridge"

[lib]
name = "uurelaybridge_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
uurelaybridge-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
